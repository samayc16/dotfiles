gui:
  showIcons: true
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - "#a9dc76"   # green
      - bold
    inactiveBorderColor:
      - "#727072"   # bright black
    searchingActiveBorderColor:
      - "#ffd866"   # yellow
      - bold
    optionsTextColor:
      - "#78dce8"   # cyan
    selectedLineBgColor:
      - "#403e41"   # black
    cherryPickedCommitFgColor:
      - "#78dce8"   # cyan
    cherryPickedCommitBgColor:
      - "#403e41"   # black
    markedBaseCommitFgColor:
      - "#78dce8"   # cyan
    markedBaseCommitBgColor:
      - "#403e41"   # black
    unstagedChangesColor:
      - "#ff6188"   # red
    defaultFgColor:
      - "#fcfcfa"   # white
git:
  # lazygit ≥ 0.5x replaced git.paging with diffRenderers (cycle with `|`).
  # delta when installed, plain coloured git diff otherwise (headless boxes).
  diffRenderers:
    - name: delta
      colorArg: always
      command: command -v delta >/dev/null 2>&1 && exec delta --paging=never || exec cat
    - name: git
      type: rawGit
  autoFetch: true
  autoRefresh: true
os:
  editPreset: nvim
