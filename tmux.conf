# ── Prefix ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g status-interval 5

# ── Vi mode ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Pane navigation (ctrl-hjkl) - vim-tmux-navigator ─────────────────
# Smart pane switching with awareness of Neovim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ── Window navigation (alt-h/l) ──────────────────────────────────────
bind -n M-h previous-window
bind -n M-l next-window

# ── Session navigation (alt-j/k) ─────────────────────────────────────
bind -n M-j switch-client -n
bind -n M-k switch-client -p

# ── Window selection (alt-1 through alt-0) ────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# ── Splits (open in current path) ────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Resize panes ─────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload config ────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Kill panes/windows without confirmation ──────────────────────────
bind x kill-pane
bind X kill-window

# ── Monokai Pro Theme ────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#403e41,fg=#fcfcfa"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#2d2a2e,bg=#a9dc76,bold]  #S #[fg=#a9dc76,bg=#403e41]"

# Right: contiguous bar - weather | date | time | hostname
set -g status-right-length 100
set -g status-right "#[fg=#78dce8,bg=#403e41]  #(~/dotfiles/scripts/tmux-weather.sh) #[fg=#727072]#[fg=#ffd866]  %b %d #[fg=#727072]#[fg=#a9dc76]  %H:%M #[fg=#727072]#[fg=#fcfcfa]  #h "

# Window tabs - inactive
set -g window-status-format "#[fg=#727072,bg=#403e41]  #I:#W  "
# Window tabs - active
set -g window-status-current-format "#[fg=#403e41,bg=#ff6188]#[fg=#2d2a2e,bg=#ff6188,bold] #I:#W #[fg=#ff6188,bg=#403e41]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#403e41"
set -g pane-active-border-style "fg=#a9dc76"
set -g pane-border-lines heavy

# Messages
set -g message-style "fg=#ffd866,bg=#403e41,bold"
set -g message-command-style "fg=#fcfcfa,bg=#403e41"

# Copy mode highlight
set -g mode-style "fg=#fcfcfa,bg=#403e41"

# ── Plugins ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ── TPM bootstrap (keep at bottom) ───────────────────────────────────
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run '~/.tmux/plugins/tpm/tpm'
