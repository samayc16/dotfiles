# =====================================
# MONOKAI PRO TMUX CONFIGURATION
# =====================================
#
# Works on macOS and Linux (desktop or headless over SSH). Full look needs
# tmux >= 3.4; older versions fall back to status-line prompts (see %if below).
#
# Glyphs are written as "\uXXXX" escapes (tmux expands them inside double
# quotes) so Nerd Font characters can't be silently stripped by editors or
# copy-paste. Needs a Nerd Font in the terminal (Meslo Nerd Font).

# -- palette (Monokai Pro "pro" filter) ------------------------------------------

%hidden BAR="#221f22"      # status bar (dark1)
%hidden BG="#2d2a2e"       # editor background
%hidden SURF="#403e41"     # raised surface / inactive borders
%hidden DIM="#5b595c"
%hidden GRAY="#727072"
%hidden SOFT="#939293"
%hidden FG="#fcfcfa"
%hidden RED="#ff6188"
%hidden ORANGE="#fc9867"
%hidden YELLOW="#ffd866"
%hidden GREEN="#a9dc76"
%hidden CYAN="#78dce8"
%hidden PURPLE="#ab9df2"

# rounded pill caps + icons
%hidden LCAP="\uE0B6"
%hidden RCAP="\uE0B4"
%hidden I_TMUX="\uEBC8"
%hidden I_ZOOM="\uF00E"
%hidden I_BELL="\uF0F3"
%hidden I_ACT="\u25CF"
%hidden I_HOST="\uF108"
%hidden I_CLOCK="\uF017"
%hidden I_KEY="\uF11C"
%hidden I_COPY="\uF0C5"
%hidden I_SYNC="\uF021"
%hidden I_EDIT="\uF040"
%hidden I_MOVE="\uF0B2"
%hidden I_FIND="\uF002"
%hidden I_PLUS="\uF067"
%hidden I_WARN="\uF071"

# helper scripts (popups, clipboard, weather) live next to this file
%hidden SCRIPTS="$HOME/dotfiles/scripts"

# -- general -------------------------------------------------------------------

# tmux-256color where the terminfo exists (macOS 14+, modern Linux); older or
# minimal boxes get screen-256color so programs inside don't see an unknown TERM
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\7"   # OSC52 clipboard

# truecolor, undercurl + coloured underlines (nvim diagnostics), hyperlinks,
# synchronized output (no tearing in TUIs)
set -as terminal-features ",xterm-kitty:RGB:usstyle:hyperlinks:sync:strikethrough:overline"
set -as terminal-features ",xterm-256color:RGB:usstyle"

# Linux desktops: keep the Wayland socket current on re-attach (DISPLAY is
# already in the default list). Fixed index so reloads don't append duplicates.
set -g update-environment[20] WAYLAND_DISPLAY

set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

set -g prefix2 C-a                        # C-a alongside the default C-b
bind C-a send-prefix -2

set -g history-limit 50000                # boost history

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title
set -g set-titles-string "#S · #W"

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# activity
set -g monitor-activity on
set -g visual-activity off

# mouse support + scroll into copy mode
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# create window in current directory
bind c new-window -c "#{pane_current_path}"

# splits - new panes open in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"   # stacked (top/bottom)
bind _ split-window -h -c "#{pane_current_path}"   # side-by-side (left/right)

# Vim awareness check
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?$'"

# Navigation (Ctrl+hjkl) - works in both tmux and nvim
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Alt+Arrows pass through to shell / Claude Code for word movement.
# (Use prefix + arrow keys to resize panes if needed.)
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down

# window / session navigation with Alt (no prefix needed)
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-j switch-client -p
bind -n M-k switch-client -n

# Kitty without macos_option_as_alt sends Unicode chars for Alt+hjkl: ˙∆˚¬
bind -n '˙' previous-window       # Alt+h
bind -n '¬' next-window           # Alt+l
bind -n '∆' switch-client -p      # Alt+j
bind -n '˚' switch-client -n      # Alt+k

# window selection with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# music (plexamp-tui): Alt+p play/pause, Alt+n next; quietly nothing when tamp isn't running.
# No Alt+b: that's word-back in the shell (`tamp prev` still works from the command line).
bind -n M-p run-shell -b 'command -v tamp >/dev/null && tamp toggle >/dev/null 2>&1; true'
bind -n M-n run-shell -b 'command -v tamp >/dev/null && tamp next >/dev/null 2>&1; true'

# Kitty Unicode for Alt+1234567890: ¡™£¢∞§¶•ªº
bind -n '¡' select-window -t 1
bind -n '™' select-window -t 2
bind -n '£' select-window -t 3
bind -n '¢' select-window -t 4
bind -n '∞' select-window -t 5
bind -n '§' select-window -t 6
bind -n '¶' select-window -t 7
bind -n '•' select-window -t 8
bind -n 'ª' select-window -t 9
bind -n 'º' select-window -t 10

# window navigation
bind Tab last-window        # move to last active window

# window management
bind > swap-window -t +1 \; select-window -t +1     # swap with next window
bind < swap-window -t -1 \; select-window -t -1     # swap with previous window

# pane management
bind z resize-pane -Z                               # zoom pane

# -- prompts: floating popups + Yes/No menus ---------------------------------------
#
# Renames, moves and "find" open a small centred popup with the current value
# pre-filled (Enter applies, Esc cancels — scripts/tmux-prompt.sh; display-popup
# doesn't expand formats, so '#{…}' args are expanded by the script). Kills ask
# through a centred menu with Cancel pre-selected. tmux < 3.4 keeps the
# classic status-line prompts.

%if "#{>=:#{version},3.4}"
bind , display-popup -E -w 52 -h 3 -T "#[align=centre fg=${PURPLE} bold] ${I_EDIT}  Rename window " \
  "${SCRIPTS}/tmux-prompt.sh '' '#{window_name}' tmux rename-window -t '#{window_id}' --"
bind '$' display-popup -E -w 52 -h 3 -T "#[align=centre fg=${PURPLE} bold] ${I_EDIT}  Rename session " \
  "${SCRIPTS}/tmux-prompt.sh '' '#{session_name}' tmux rename-session -t '#{session_id}' --"
bind . display-popup -E -w 52 -h 3 -T "#[align=centre fg=${PURPLE} bold] ${I_MOVE}  Move window to index " \
  "${SCRIPTS}/tmux-prompt.sh '' '' tmux move-window -s '#{window_id}' -t"
bind C-f display-popup -E -w 52 -h 3 -T "#[align=centre fg=${PURPLE} bold] ${I_FIND}  Find session " \
  "${SCRIPTS}/tmux-prompt.sh '' '' tmux switch-client -c '#{client_name}' -t"
bind x display-menu -x C -y C -C 1 -T "#[align=centre fg=${RED} bold] ${I_WARN}  Kill pane #{pane_index} · #{pane_current_command}? " \
  "Kill pane" y kill-pane \
  "Cancel"    n ""
bind X display-menu -x C -y C -C 1 -T "#[align=centre fg=${RED} bold] ${I_WARN}  Kill window #{window_index} · #{window_name}? " \
  "Kill window" y kill-window \
  "Cancel"      n ""
%else
bind , command-prompt -I "#W" "rename-window '%%'"  # rename window
bind '$' command-prompt -I "#S" "rename-session '%%'" # rename session
bind . command-prompt "move-window -t '%%'"         # move window
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind x confirm-before -p "kill pane? (y/n)" kill-pane      # kill pane (with confirm)
bind X confirm-before -p "kill window? (y/n)" kill-window  # kill window (with confirm)
%endif

# pane resize with Alt+Shift+hjkl (no prefix)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind Space next-layout                              # cycle layouts
bind = select-layout even-horizontal                # balance panes horizontally
bind | select-layout even-vertical                  # balance panes vertically

# toggle mouse
bind m set -g mouse \; display "Mouse #{?mouse,on,off}"

# toggle synchronize panes (type in all panes at once)
bind S setw synchronize-panes \; display "Sync panes #{?synchronize-panes,on,off}"

# clear history
bind C-l send-keys C-l \; clear-history

# help
bind ? display-popup -E -w 78 -h 36 "bash \"$HOME/dotfiles/scripts/tmux-help.sh\" && read -n 1"

# session / window picker (prefix s / w): same keys, tidier rows
%hidden TREE_FMT="#{?pane_format,#[fg=${SOFT}]#{pane_current_command}  #[fg=${GRAY}]#{pane_current_path},#{?window_format,#[fg=${FG}]#{window_name}#{?window_active,#[fg=${RED}]  ${I_ACT},}#[fg=${GRAY}]  #{window_panes} panes,#[fg=${GRAY}]#{session_windows} windows#{?session_attached,#[fg=${GREEN}]  ${I_ACT} attached,}}}"
bind s choose-tree -Zs -F "${TREE_FMT}"
bind w choose-tree -Zw -F "${TREE_FMT}"

# -- look: status bar ------------------------------------------------------------
#
#   ( work)  (1 editor)  2 logs ●  3 build              52°F  ( Sun 22 Nov 14:51)
#
# Soft pills only for the session (green), the active window (pink) and the
# date/time (gray); everything else is quiet text with small markers
# (● activity, bell, zoom). PREFIX / COPY / SYNC appear as coloured text
# (tmux-prefix-highlight); host shows only over SSH; weather hides offline.

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${BAR},fg=${FG}"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=${GREEN},bg=${BAR}]${LCAP}#[fg=${BAR},bg=${GREEN},bold]${I_TMUX} #S#[fg=${GREEN},bg=${BAR},nobold]${RCAP}  "

# Host is only worth showing when this tmux server runs over SSH; decided
# once per server start / reload.
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @ssh_host 1' 'set -g @ssh_host 0'

# Weather location is wttr.in's IP geolocation (no city hardcoded).
set -g status-right "#{prefix_highlight}#{?#{@ssh_host},#[fg=${CYAN}]${I_HOST} #h  ,}#[fg=${GREEN},bg=${BAR}]#(command -v tamp >/dev/null && tamp status --tmux --width 36)#[fg=${SOFT},bg=${BAR}]#(${SCRIPTS}/tmux-weather.sh)#[fg=${SURF},bg=${BAR}]${LCAP}#[fg=${SOFT},bg=${SURF}]${I_CLOCK}  %a %d %b  #[fg=${FG},bold]%H:%M#[fg=${SURF},bg=${BAR},nobold]${RCAP}"

# window flags: zoomed, bell, activity (coloured on plain tabs, dark inside the pill)
%hidden WFLAGS="#{?window_zoomed_flag,#[fg=${YELLOW}] ${I_ZOOM},}#{?window_bell_flag,#[fg=${RED}] ${I_BELL},}#{?window_activity_flag,#[fg=${YELLOW}] ${I_ACT},}"
%hidden WFLAGS_PILL="#{?window_zoomed_flag, ${I_ZOOM},}"

set -g window-status-separator "  "
set -g window-status-format "#[fg=${GRAY}]#I #[fg=${SOFT}]#W${WFLAGS}"
set -g window-status-current-format "#[fg=${RED},bg=${BAR}]${LCAP}#[fg=${BAR},bg=${RED},bold]#I #W${WFLAGS_PILL}#[fg=${RED},bg=${BAR},nobold]${RCAP}"

# the formats above draw their own colours; keep the base styles neutral
set -g window-status-style "fg=${SOFT},bg=${BAR}"
set -g window-status-current-style "fg=${FG},bg=${BAR}"
set -g window-status-activity-style "fg=${SOFT},bg=${BAR}"
set -g window-status-bell-style "fg=${SOFT},bg=${BAR}"
set -g window-status-last-style "fg=${SOFT},bg=${BAR}"

# -- look: panes, messages, modes, popups -----------------------------------------

# Active border: green normally, purple in copy mode, orange while panes are synced
set -g pane-border-lines single
set -g pane-border-style "fg=${SURF}"
set -g pane-active-border-style "#{?pane_in_mode,fg=${PURPLE},#{?pane_synchronized,fg=${ORANGE},fg=${GREEN}}}"

# Messages and the : command prompt take over the whole status line (fill=)
# behind a small › marker, instead of a half-painted yellow block.
set -g message-style "fg=${FG},bg=${BAR},fill=${BAR}"
set -g message-command-style "fg=${FG},bg=${BAR},fill=${BAR}"
set -gq message-format "#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}] #[fg=${PURPLE} bold]›#[fg=${FG} nobold] #{message}"
set -gq prompt-cursor-colour "${PURPLE}"

# Copy mode + choose-tree selection, search matches
set -g mode-style "fg=${FG},bg=${SURF},bold"
set -gq copy-mode-selection-style "fg=${BAR},bg=${PURPLE}"
set -gq copy-mode-match-style "fg=${BG},bg=${CYAN}"
set -gq copy-mode-current-match-style "fg=${BG},bg=${YELLOW},bold"
set -gq copy-mode-mark-style "fg=${BG},bg=${ORANGE}"

# Popups (prompts, prefix + ?, tmux-fzf) and menus (kill confirms, right-click)
set -gq popup-style "fg=${FG},bg=${BAR}"
set -gq popup-border-lines rounded
set -gq popup-border-style "fg=${DIM},bg=${BAR}"
set -gq menu-border-lines rounded
set -gq menu-border-style "fg=${DIM},bg=${BAR}"
set -gq menu-style "fg=${FG},bg=${BAR}"
set -gq menu-selected-style "fg=${BAR},bg=${PURPLE},bold"

# Clock mode (`tmux clock-mode`; prefix + t is join-pane, from tmux-sessionist)
set -g clock-mode-colour "${CYAN}"
set -g clock-mode-style 24

# Display panes (when you press prefix + q)
set -g display-panes-active-colour "${GREEN}"
set -g display-panes-colour "${GRAY}"

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'                     # prefix+F for fuzzy session/window/pane picker

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank: native clipboard picked at runtime (pbcopy / wl-copy / xclip /
# xsel / clip.exe, or nothing on headless boxes). OSC52 (set-clipboard on)
# still carries every copy to the local terminal, including over SSH.
set -g @override_copy_command "${SCRIPTS}/tmux-clipboard.sh"

# prefix-highlight: plain coloured text, no pills. The plugin splices these into
# a #{?…,…,…} conditional, so styles must avoid commas: one attribute per #[…].
set -g @prefix_highlight_fg "${YELLOW}"
set -g @prefix_highlight_bg "${BAR}"
set -g @prefix_highlight_output_prefix ""
set -g @prefix_highlight_output_suffix "    "
set -g @prefix_highlight_prefix_prompt "#[bold]${I_KEY}  PREFIX#[nobold]"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=${PURPLE},bg=${BAR}"
set -g @prefix_highlight_copy_prompt "#[bold]${I_COPY}  COPY#[nobold]"
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr "fg=${ORANGE},bg=${BAR}"
set -g @prefix_highlight_sync_prompt "#[bold]${I_SYNC}  SYNC#[nobold]"

# sessionist: keep S (sync) and X (kill window) as bound above
set -g @sessionist-alternate 'A'          # switch to last session
set -g @sessionist-kill-session 'C-x'     # kill session (with prompt)

# Fix italics and bold
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Enable OSC52 clipboard support for kitty and other modern terminals
set -s set-clipboard on
set -gq allow-passthrough on

# Enable vi mode in copy mode
setw -g mode-keys vi

# Vi-style copy mode bindings
bind [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Initialize TMUX plugin manager. First run on a new machine: clone tpm and
# install the plugins listed above (needs git + network once).
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# -- after plugins: sessionist prompts as popups / menus (same keys) ---------------
%if "#{>=:#{version},3.4}"
bind C display-popup -E -w 52 -h 3 -T "#[align=centre fg=${PURPLE} bold] ${I_PLUS}  New session " \
  "${SCRIPTS}/tmux-prompt.sh '' '' ${SCRIPTS}/tmux-session.sh new"
bind g display-popup -E -w 52 -h 14 -T "#[align=centre fg=${PURPLE} bold] ${I_FIND}  Go to session " \
  "${SCRIPTS}/tmux-session.sh goto"
bind C-x display-menu -x C -y C -C 1 -T "#[align=centre fg=${RED} bold] ${I_WARN}  Kill session #{session_name}? " \
  "Kill session" y "run-shell \"$HOME/.tmux/plugins/tmux-sessionist/scripts/kill_session.sh '#{session_id}'\"" \
  "Cancel"       n ""
%endif
