# ── Prefix ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ",xterm*:sitm=\E[3m"   # italics
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g history-limit 50000
set -g escape-time 0
set -sg repeat-time 600
set -g focus-events on
set -g status-interval 5
set -g display-panes-time 800
set -g display-time 1000

# Activity: flag busy windows in the status bar, no bell/flash
set -g monitor-activity on
set -g visual-activity off

# Clipboard: let apps inside tmux (nvim, `copy`, kitty icat) reach the terminal
set -g set-clipboard on
set -gq allow-passthrough on

# ── Vi mode ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Pane navigation (ctrl-hjkl) - vim-tmux-navigator ─────────────────
# Smart pane switching with awareness of Neovim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ── Window navigation (alt-h/l) ──────────────────────────────────────
bind -n M-h previous-window
bind -n M-l next-window
bind Tab last-window

# ── Session navigation (alt-j/k) ─────────────────────────────────────
bind -n M-j switch-client -n
bind -n M-k switch-client -p

# ── Window selection (alt-1 through alt-0) ────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Kitty without macos_option_as_alt (or other terminals over SSH) sends the
# Unicode chars Option+key produces on a US layout. Bind those too.
bind -n '˙' previous-window       # Alt+h
bind -n '¬' next-window           # Alt+l
bind -n '∆' switch-client -n      # Alt+j
bind -n '˚' switch-client -p      # Alt+k
bind -n '¡' select-window -t 1    # Alt+1
bind -n '™' select-window -t 2    # Alt+2
bind -n '£' select-window -t 3    # Alt+3
bind -n '¢' select-window -t 4    # Alt+4
bind -n '∞' select-window -t 5    # Alt+5
bind -n '§' select-window -t 6    # Alt+6
bind -n '¶' select-window -t 7    # Alt+7
bind -n '•' select-window -t 8    # Alt+8
bind -n 'ª' select-window -t 9    # Alt+9
bind -n 'º' select-window -t 10   # Alt+0

# ── Splits (open in current path) ────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Sessions ─────────────────────────────────────────────────────────
bind C-c new-session
bind C-f command-prompt -p "find-session:" "switch-client -t '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"
bind C-x confirm-before -p "kill session #S? (y/n)" kill-session

# ── Window management ────────────────────────────────────────────────
bind , command-prompt -I "#W" "rename-window '%%'"
bind . command-prompt -p "move-window to:" "move-window -t '%%'"
bind > swap-window -t +1 \; select-window -t +1
bind < swap-window -t -1 \; select-window -t -1

# ── Resize panes ─────────────────────────────────────────────────────
# prefix + HJKL (repeatable) or Alt+Shift+HJKL with no prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ── Layouts ──────────────────────────────────────────────────────────
bind z resize-pane -Z                   # zoom toggle
bind Space next-layout                  # cycle layouts
bind = select-layout even-horizontal    # balance side-by-side
bind + select-layout even-vertical      # balance stacked

# ── Toggles ──────────────────────────────────────────────────────────
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"
bind S setw synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"
bind C-l send-keys C-l \; clear-history

# ── Reload config ────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Kill panes/windows without confirmation ──────────────────────────
bind x kill-pane
bind X kill-window

# ── Monokai Pro Theme ────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#403e41,fg=#fcfcfa"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#2d2a2e,bg=#a9dc76,bold]  #S #[fg=#a9dc76,bg=#403e41]"

# Right: prefix indicator | weather | date | time | hostname
set -g status-right-length 100
set -g status-right "#{prefix_highlight}#[fg=#78dce8,bg=#403e41]  #(~/dotfiles/scripts/tmux-weather.sh) #[fg=#727072]#[fg=#ffd866]  %b %d #[fg=#727072]#[fg=#a9dc76]  %H:%M #[fg=#727072]#[fg=#fcfcfa]  #h "

# Window tabs - inactive
set -g window-status-format "#[fg=#727072,bg=#403e41]  #I:#W  "
# Window tabs - active
set -g window-status-current-format "#[fg=#403e41,bg=#ff6188]#[fg=#2d2a2e,bg=#ff6188,bold] #I:#W #[fg=#ff6188,bg=#403e41]"
set -g window-status-separator ""
# Window tabs - activity in a background window
set -g window-status-activity-style "fg=#ffd866,bg=#403e41"

# Pane borders
set -g pane-border-style "fg=#403e41"
set -g pane-active-border-style "fg=#a9dc76"
set -g pane-border-lines heavy

# Messages
set -g message-style "fg=#ffd866,bg=#403e41,bold"
set -g message-command-style "fg=#fcfcfa,bg=#403e41"

# Copy mode highlight
set -g mode-style "fg=#fcfcfa,bg=#403e41"

# Clock (prefix t) and pane numbers (prefix q)
set -g clock-mode-colour "#78dce8"
set -g clock-mode-style 24
set -g display-panes-active-colour "#a9dc76"
set -g display-panes-colour "#727072"

# ── Help popup (prefix-?) ──────────────────────────────────────────────
bind ? display-popup -w 94 -h 32 -E "bash ~/dotfiles/scripts/tmux-help.sh"

# ── Plugins ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # prefix/copy indicator in status bar
set -g @plugin 'sainnhe/tmux-fzf'                   # prefix F fuzzy session/window/pane picker

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @prefix_highlight_fg '#2d2a2e'
set -g @prefix_highlight_bg '#ff6188'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#2d2a2e,bg=#ffd866,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=#2d2a2e,bg=#78dce8,bold'
set -g @prefix_highlight_output_suffix ' '

# ── TPM bootstrap (keep at bottom) ───────────────────────────────────
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"
run '~/.tmux/plugins/tpm/tpm'
