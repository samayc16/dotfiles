# kitty — macOS only (included from kitty.conf when KITTY_OS=macos)

font_size 14.0

# Option acts as Alt (zsh/tmux/nvim Alt bindings). tmux.conf also binds the
# Unicode characters Option sends if this is ever turned off.
macos_option_as_alt                yes
macos_titlebar_color               background
macos_quit_when_last_window_closed yes
hide_window_decorations            no

# ── Keymaps (⌘) ───────────────────────────────────────────────────────
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+right   next_tab
map cmd+left    previous_tab
map cmd+equal   change_font_size all +1.0
map cmd+minus   change_font_size all -1.0
map cmd+0       change_font_size all 0
map cmd+shift+enter new_window_with_cwd
map cmd+k combine : clear_scrollback : send_text normal \x0c
