# kitty — Linux only (included from kitty.conf when KITTY_OS=linux or bsd)
#
# Shortcuts use kitty's ctrl+shift defaults (kitty_mod); only the ones that
# differ from the macOS ⌘ maps are overridden here:
#   ctrl+shift+t       new tab in cwd        ctrl+shift+enter  new window in cwd
#   ctrl+shift+= / -   font size ±1          ctrl+shift+bksp   reset font size
#   ctrl+alt+1..9      go to tab N           ctrl+shift+←/→    prev / next tab
#   ctrl+shift+q       close tab             ctrl+shift+delete clear screen + scrollback

font_size 11.5

# X11 or Wayland, whichever the session provides.
linux_display_server    auto
# Client-side titlebar (GNOME/Wayland) blends with the background like macOS.
wayland_titlebar_color  background
hide_window_decorations no

# ── Keymaps (ctrl+shift) ──────────────────────────────────────────────
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
