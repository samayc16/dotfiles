# ── Font ──────────────────────────────────────────────────────────────
font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ── Cursor ────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0
shell_integration     enabled

# ── Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Window ────────────────────────────────────────────────────────────
window_padding_width  8
hide_window_decorations no
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# ── macOS specific ────────────────────────────────────────────────────
macos_option_as_alt        yes
macos_titlebar_color       background
macos_quit_when_last_window_closed yes

# ── Keymaps ───────────────────────────────────────────────────────────
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+right   next_tab
map cmd+left    previous_tab
map cmd+equal   change_font_size all +1.0
map cmd+minus   change_font_size all -1.0
map cmd+0       change_font_size all 0
map cmd+shift+enter new_window_with_cwd
map cmd+k combine : clear_scrollback : send_text normal \x0c

# ── Monokai Pro Color Scheme ─────────────────────────────────────────
foreground #fcfcfa
background #2d2a2e

# Black
color0  #403e41
color8  #727072

# Red
color1  #ff6188
color9  #ff6188

# Green
color2  #a9dc76
color10 #a9dc76

# Yellow
color3  #ffd866
color11 #ffd866

# Blue
color4  #fc9867
color12 #fc9867

# Magenta
color5  #ab9df2
color13 #ab9df2

# Cyan
color6  #78dce8
color14 #78dce8

# White
color7  #fcfcfa
color15 #fcfcfa

# Cursor
cursor            #fcfcfa
cursor_text_color #2d2a2e

# Selection
selection_foreground #fcfcfa
selection_background #403e41

# Tab bar
active_tab_foreground   #2d2a2e
active_tab_background   #fcfcfa
inactive_tab_foreground #939293
inactive_tab_background #403e41

# URLs
url_color #78dce8
url_style curly
