# kitty — shared config (macOS + Linux). Monokai Pro, Meslo Nerd Font.
#
# OS-specific settings live in macos.conf / linux.conf (bsd.conf → linux.conf)
# and are pulled in at the bottom via ${KITTY_OS}, which kitty sets to
# linux | macos | bsd. Relative includes resolve next to the *symlink* in
# ~/.config/kitty/, so those files must be linked there too (or link the dir).

# ── Font ──────────────────────────────────────────────────────────────
# Same family everywhere (tmux/nvim/p10k glyphs assume a Nerd Font).
# Size is per-OS: see macos.conf / linux.conf.
font_family      MesloLGM Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# ── Cursor ────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0
shell_integration     enabled

# ── Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Window ────────────────────────────────────────────────────────────
window_padding_width  8
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# ── Clipboard / remote ────────────────────────────────────────────────
# OSC52 writes from SSH/tmux (`copy`, nvim). no-append: replace, don't append.
clipboard_control    write-clipboard write-primary no-append
# Off: nothing here uses it, and `yes` lets any text printed in a window (a file, curl, ssh output)
# drive kitty: open windows, type into them, read their scrollback.
allow_remote_control no

# ── Monokai Pro Color Scheme ─────────────────────────────────────────
foreground #fcfcfa
background #2d2a2e

# Black
color0  #403e41
color8  #727072

# Red
color1  #ff6188
color9  #ff6188

# Green
color2  #a9dc76
color10 #a9dc76

# Yellow
color3  #ffd866
color11 #ffd866

# Blue
color4  #78dce8
color12 #78dce8

# Magenta
color5  #ab9df2
color13 #ab9df2

# Cyan
color6  #78dce8
color14 #78dce8

# White
color7  #fcfcfa
color15 #fcfcfa

# Cursor
cursor            #fcfcfa
cursor_text_color #2d2a2e

# Selection
selection_foreground #fcfcfa
selection_background #403e41

# Tab bar
active_tab_foreground   #2d2a2e
active_tab_background   #fcfcfa
inactive_tab_foreground #939293
inactive_tab_background #403e41

# URLs
url_color #78dce8
url_style curly

# ── OS-specific (last, so it can override anything above) ─────────────
include ${KITTY_OS}.conf
