# Codex CLI: a starting config with a metric-rich native status line. The installer copies it
# to ~/.codex/config.toml once; edit that copy (it never comes back to this repo).
# Cautious by default: Codex asks before leaving the sandbox, and writes only inside the workspace.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

# Match the high-reasoning, agentic Claude setup without pinning a model version.
model_reasoning_effort = "xhigh"
personality = "pragmatic"

[agents]
enabled = true

[features]
unified_exec = true

[tui]
notifications = true
theme = "monokai-extended-origin"
status_line_use_colors = true
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "estimated-thread-cost",
  "branch-changes",
]
